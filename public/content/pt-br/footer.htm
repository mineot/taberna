<twc-columns cols="4" gap="6">
  <twc-brand description></twc-brand>

  <div class="flex w-full md:justify-center">
    <twc-rows gap="4">
      <h2 class="text-lg" style="color: var(--emphasis-color)">
        Links Internos
      </h2>
      <twc-rows gap="2">
        <twc-link href="#/page1" label="Página 1"></twc-link>
        <twc-link href="#/page2" label="Página 2"></twc-link>
        <twc-link href="#/page3" label="Página 3"></twc-link>
      </twc-rows>
    </twc-rows>
  </div>

  <div class="flex w-full md:justify-center">
    <twc-rows gap="4">
      <h2 class="text-lg" style="color: var(--emphasis-color)">
        Links Externos
      </h2>
      <twc-rows gap="2">
        <twc-link
          href="https://github.com/mineot/"
          label="Github"
          external
        ></twc-link>
        <twc-link
          href="https://www.instagram.com/'"
          label="Instagram"
          external
        ></twc-link>
        <twc-link
          href="https://web.whatsapp.com/"
          label="WhatsApp"
          external
        ></twc-link>
      </twc-rows>
    </twc-rows>
  </div>

  <div class="flex w-full md:justify-center">
    <twc-rows gap="4">
      <h2 class="text-lg" style="color: var(--emphasis-color)">Imagem</h2>
      <img class="rounded-lg" src="https://placehold.co/82x82" alt="image" />
    </twc-rows>
  </div>
</twc-columns>
